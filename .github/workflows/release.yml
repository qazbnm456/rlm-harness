name: Release

# Publish to PyPI via Trusted Publishing (OIDC): NO API token. This is INERT until a
# GitHub Release is published, and requires one-time setup before the first release:
#   1. On PyPI, add a Trusted Publisher for project `rlm-harness`:
#        owner = qazbnm456, repo = rlm-harness, workflow = release.yml, environment = pypi
#   2. In this repo's settings, create an environment named `pypi`.
# Then publishing a GitHub Release (from a `vX.Y.Z` tag) builds + uploads automatically.
# Supply-chain: the two third-party actions are SHA-pinned, setup-uv, and (highest blast radius, it
# uploads to PyPI) pypi-publish. Bump a SHA and its trailing version comment together. GitHub-owned
# checkout/*-artifact stay on major tags -- setup-uv stopped publishing major tags at v8, so it can only
# be named by full version or SHA now. Every action here targets Node 24: GitHub deprecated Node 20 and was
# force-running the v4 actions on 24 anyway, warning on every build. The one behaviour change that came with
# it is worth knowing rather than rediscovering: setup-uv v10 DISABLES its cache by default on a `release`
# event (cache poisoning -- a release build is the highest-value thing in this repo to poison). This job
# passes no `enable-cache`, so it takes that default deliberately and builds uncached, once per release.
#
# **If this workflow itself is broken, fixing `main` does NOTHING until the TAG moves.** A
# `release: published` event runs the workflow file at the TAG's commit, not at main's head, so a
# failed publish is recovered by fixing main AND re-pointing the tag at the fix, not by pushing and
# re-running. Safe only while nothing was uploaded, since a PyPI version can never be reused; check
# that first. Reported by a downstream consumer who hit it live and lost the time; not reproduced
# here, because reproducing it costs a burned version number.
#
# **`pyproject.toml`'s `requires = ["hatchling>=1.27"]` is a LOWER bound, so what this job uploads
# can change with nothing in this repo changing.** The same consumer's release failed on
# `InvalidDistribution: '2.5' is not a valid metadata version`: hatchling had moved to core
# metadata 2.5 (PEP 639 `license`/`license-files`) and the twine bundled in `gh-action-pypi-publish`
# below v1.14.2 did not accept it. This repo is on v1.14.2 and is not exposed TODAY, which was luck:
# that SHA was pinned for supply-chain reasons, not this one. Left as a lower bound on purpose: the
# failure is LOUD (the release fails, nothing uploads, the version is not burned), so the cost is a
# delayed release rather than a corrupted one, which is cheaper than pinning the build backend and
# taking on the bump treadmill. `install-check.yml` cannot see this class at all: it tests the
# PUBLISHED artifact, and there is no artifact when the publish is what failed.
#
# **Do not verify a publish through `pypi.org/pypi/<name>/json`.** It is CDN-cached and served a
# stale "latest" while two fresh installs of the new version had already succeeded. `/simple/` is
# what installers actually read, and `/pypi/<name>/<version>/json` answers for one version; both
# were correct at the moment the aggregate endpoint was wrong. Observed here publishing 1.11.0 and
# independently by a consumer on their own release.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build sdist + wheel
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Fork guard. `release: published` is inherited by every fork, so a fork cutting its own release
    # would fire this job and ask PyPI to publish `rlm-harness` over OIDC. The Trusted Publisher binding
    # (owner+repo+workflow+environment) would reject it, but that is a rejected publish attempt against
    # OUR project, plus a probe surface and a confusing red run in someone else's repo. `build` above is
    # deliberately NOT guarded: it only builds an artifact, and a fork verifying its own build is fine.
    if: github.repository == 'qazbnm456/rlm-harness'
    environment: pypi
    permissions:
      id-token: write          # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # v1.14.2+ required: hatchling>=1.27 (PEP 639 SPDX license) emits Metadata-Version 2.5,
      # which v1.14.0/v1.14.1's bundled twine does not recognize: the 1.2.1 release run failed
      # here with `InvalidDistribution: '2.5' is not a valid metadata version` before ever
      # reaching PyPI. v1.14.2 bumped twine to v7, which added 2.5 support.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
