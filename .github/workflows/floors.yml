name: declared floors

# Can anyone still resolve the dependency floors this project DECLARES?
#
# Every other job here asks whether the kit works against some version it RESOLVED. None of them
# can see the lower bound go stale, and that is not an oversight in them: a yank is invisible to
# an install. Range resolution silently skips a yanked version, so `>=0.1.60` resolved 0.1.61 and
# every job stayed green while the declared floor was a file PyPI had scheduled for deletion. An
# exact pin installs a yanked file too, with a warning nobody reads. The install only breaks at
# DELETION, which is months later and lands on a consumer rather than here.
#
# So this reads the index instead of installing, per declared floor, and a yank is the early
# notice that the deletion is coming. Two it has caught: `claude-agent-sdk>=0.1.60`, which
# prompted it, and `jsonschema>=4.0`, yanked for publishing an empty `requires-python`.
#
# A red here is NOT urgent and NOT a rollback. The kit keeps working, because resolution already
# moved past the yanked version; what is broken is the CLAIM, and a claim nobody can test is the
# thing this repo keeps paying for. Fix it by raising the floor to the nearest published version
# the suite passes on, in the next release, and say in the comment why the old one went away.
#
# Exit codes from the script, so a reader can tell a verdict from a transport failure: 1 means a
# floor is unresolvable, 2 means the index could not be reached and the floors were NOT judged.
#
# The second job is the other half of the same claim. Reading the index says a floor can be
# RESOLVED; it says nothing about whether the kit works on it, and every floor comment in
# `pyproject.toml` asserts that it does. `uv run --resolution lowest-direct` pins each direct
# dependency to its floor and leaves transitive ones alone, which is exactly the claim's scope.
# Measured before this job existed: the suite passes that way on Python 3.11, the same count
# it passes at resolved versions, so the floors are not a weaker configuration than CI's.
#
# A LIMIT, stated rather than discovered: `on:` is workflow-scoped, so both jobs run weekly, on
# demand, and on a push that touches `pyproject.toml` or this workflow's own files. A code change
# that breaks ONLY the floor run therefore waits for the cron rather than reddening its own PR.
# That is the trade for not running a second full suite on every push; `ci.yml` covers the three
# interpreters at their resolved versions on every PR, which is where a code break shows first.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repository activity. If this
# stops ticking, a push (or a manual `workflow_dispatch`) re-arms it.

on:
  schedule:
    # Mondays 08:11 UTC: off the hour, and clear of `dspy-latest.yml` (06:17) and
    # `install-check.yml` (07:43) so three unrelated reds never arrive looking related.
    - cron: "11 8 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    # Only when a floor could have changed. A yank needs no commit to happen, which is what the
    # cron is for; this leg catches DECLARING one that is already yanked, at the moment it lands.
    paths:
      - "pyproject.toml"
      - ".github/scripts/check_declared_floors.py"
      - ".github/workflows/floors.yml"

permissions:
  contents: read

concurrency:
  group: floors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floors:
    name: declared floors are published
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # No install step and no dependencies: the script is standard library only, on purpose, so
      # this job cannot be reddened by the very resolution it exists to judge.
      - name: Check every declared floor against the index
        run: python .github/scripts/check_declared_floors.py

  suite:
    name: the suite on the declared floors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      # ONE leg, and 3.11 because that is the `requires-python` floor: lowest dependencies on the
      # lowest interpreter is the strongest single form of the claim. The extras are the project's
      # own verify command's, so the floors this exercises are the ones the suite actually reaches;
      # `memory-vectors` is left out because the suite fakes that model runtime anyway, so adding
      # it would cost a 135 MB download and prove nothing more.
      #
      # `lowest-direct`, never `lowest`: pinning TRANSITIVE dependencies to their floors tests a
      # combination nobody ships and goes red on other people's history.
      - name: Run the suite with every direct dependency at its floor
        run: >
          uv run --resolution lowest-direct
          --group dev --extra mcp --extra grep --extra gitignore
          python -m pytest -q
