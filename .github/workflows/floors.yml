name: declared floors

# Can anyone still resolve the dependency floors this project DECLARES?
#
# Every other job here asks whether the kit works against some version it RESOLVED. None of them
# can see the lower bound go stale, and that is not an oversight in them: a yank is invisible to
# an install. Range resolution silently skips a yanked version, so `>=0.1.60` resolved 0.1.61 and
# every job stayed green while the declared floor was a file PyPI had scheduled for deletion. An
# exact pin installs a yanked file too, with a warning nobody reads. The install only breaks at
# DELETION, which is months later and lands on a consumer rather than here.
#
# So this reads the index instead of installing, per declared floor, and a yank is the early
# notice that the deletion is coming. It found two on the day it was written: the
# `claude-agent-sdk>=0.1.60` that prompted it, and `jsonschema>=4.0`, yanked for publishing an
# empty `requires-python`.
#
# A red here is NOT urgent and NOT a rollback. The kit keeps working, because resolution already
# moved past the yanked version; what is broken is the CLAIM, and a claim nobody can test is the
# thing this repo keeps paying for. Fix it by raising the floor to the nearest published version
# the suite passes on, in the next release, and say in the comment why the old one went away.
#
# Exit codes from the script, so a reader can tell a verdict from a transport failure: 1 means a
# floor is unresolvable, 2 means the index could not be reached and the floors were NOT judged.
#
# NOT here, deliberately: running the suite against `--resolution lowest-direct`, which is the
# other half of "a floor is only meaningful if the suite passes on it" and is queued for 1.22.0.
# It needs a matrix decision (which interpreters, which extras) that this job does not.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repository activity. If this
# stops ticking, a push (or a manual `workflow_dispatch`) re-arms it.

on:
  schedule:
    # Mondays 08:11 UTC: off the hour, and clear of `dspy-latest.yml` (06:17) and
    # `install-check.yml` (07:43) so three unrelated reds never arrive looking related.
    - cron: "11 8 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    # Only when a floor could have changed. A yank needs no commit to happen, which is what the
    # cron is for; this leg catches DECLARING one that is already yanked, at the moment it lands.
    paths:
      - "pyproject.toml"
      - ".github/scripts/check_declared_floors.py"
      - ".github/workflows/floors.yml"

permissions:
  contents: read

concurrency:
  group: floors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floors:
    name: declared floors are published
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # No install step and no dependencies: the script is standard library only, on purpose, so
      # this job cannot be reddened by the very resolution it exists to judge.
      - name: Check every declared floor against the index
        run: python .github/scripts/check_declared_floors.py .
