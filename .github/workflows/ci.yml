name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only checks out code and runs tests/lint — it never writes. Specifying
# `permissions:` also drops every unlisted scope to `none`, so a compromised dep/action on an untrusted
# fork PR can't use the token to push, tag, or open issues. The third-party setup-uv action is SHA-pinned
# (a repointed tag could inject code that runs with the token); GitHub-owned checkout stays on a major tag.
# setup-uv no longer offers the alternative: from v8 it STOPPED PUBLISHING major/minor tags outright, for
# this same reason (the tj-actions compromise), so `@v10` does not resolve and a full version tag or a SHA
# is the only way to name it.
# CI needs no live model, no vLLM, no network, no Deno: the dspy-bearing tests use a DummyLM or skip when
# dspy is absent.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # `python-version` sets UV_PYTHON, which is the whole matrix: without it every job would
          # resolve the same interpreter and three green rows would mean one. setup-uv v6 stopped
          # ALSO activating a venv at the repo root from this input (`activate-environment`, false
          # by default) -- checked against every step below rather than assumed: they all go through
          # `uv run` / `uv build` / `uvx` / an explicit `uv venv`, none of which need an activated one.
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run tests
        # --extra mcp so the MCP-client tests run (they spawn a stdio MCP subprocess) rather than skip.
        # --extra grep so make_grep_files_tool's timeout tests exercise the real `regex` package
        # rather than skip — the whole point of that test suite is verifying a REAL timeout fires.
        # --extra gitignore so list_candidate_paths's .gitignore-parsing tests exercise the real
        # `pathspec` package rather than skip.
        run: uv run --group dev --extra mcp --extra grep --extra gitignore python -m pytest -q

  mcp-major:
    # The `mcp` extra is UNCAPPED, and `uv.lock` can only hold one version — so the suite above
    # proves nothing about the OTHER published major. It went unnoticed once: SDK 2.0 renamed the
    # result fields camelCase -> snake_case and every FAILED MCP tool call started reading as a
    # SUCCESS to the model, with CI fully green (CHANGELOG 1.5.0).
    #
    # PINNED, and hand-bumped like `uvx ruff@...` below: this runs on `pull_request`, so a
    # floating version would let an upstream release redden a contributor's unrelated PR — the
    # exact reason `dspy-latest.yml` is kept off that trigger. The moving target is covered there;
    # this job covers "the other major still works", which is a property of OUR code.
    name: test (mcp 2.x)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          # Same key as `test (py3.13)`, which runs concurrently and writes it. See `packaging`.
          save-cache: false
      - name: Run the suite against the other MCP major
        run: uv run --group dev --extra mcp --extra grep --extra gitignore --with "mcp==2.1.1" python -m pytest -q

  packaging:
    name: packaging (fresh install)
    runs-on: ubuntu-latest
    # The PACKAGING axis, and only that: does a wheel built from this tree install into a clean
    # environment with no lockfile and actually run? Genuinely untested until now — every other
    # job runs from the source tree via `uv run`, so a module missing from the wheel, or a
    # dependency the lock happened to provide, would ship silently.
    #
    # It is NOT a substitute for the dspy axis (`dspy-latest.yml`). Measured, not assumed: an
    # offline end-to-end run still returns the CORRECT answer while a renamed dspy kwarg silently
    # drops the caller's budget cap — so this catches a LOUD break and is blind to exactly the
    # silent ones `_dspy_compat` exists for. Do not let a green run here stand in for that.
    #
    # dspy is PINNED to `uv.lock`'s version here, even though the point of the job is a
    # lockfile-free install. This job runs on `pull_request`, and letting it float dspy would let
    # an upstream release redden a contributor's unrelated PR — the exact thing
    # `dspy-latest.yml` is kept out of the PR trigger to avoid. Floating dspy is THAT job's
    # responsibility; this one varies only the packaging. Everything else still resolves fresh,
    # which is what makes it a real fresh-install test.
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          # RESTORE the cache, never save it. This job and `test (py3.13)` derive the SAME setup-uv
          # cache key (same interpreter, same `uv.lock` hash) and run concurrently, so both tried to
          # reserve it and the loser warned on every run. A shared key is the RIGHT outcome -- one
          # copy, both restore -- so the fix is to stop the second job racing to write it rather than
          # to give it a `cache-suffix` and store the same thing twice. The test job is also the
          # honest owner of that key: what it caches IS the locked dependency set the key names,
          # while this job deliberately resolves fresh without the lockfile.
          save-cache: false
      - name: Build the wheel and run a task from it
        run: |
          set -euo pipefail
          LOCKED=$(python3 -c '
          import re, pathlib
          m = re.search(r"name = \"dspy\"\nversion = \"([^\"]+)\"", pathlib.Path("uv.lock").read_text())
          print(m.group(1) if m else "")')
          test -n "$LOCKED" || { echo "could not read dspy's version from uv.lock"; exit 1; }
          echo "pinning dspy==$LOCKED (the locked version) so an upstream release cannot fail a PR"
          uv build --wheel
          uv venv /tmp/fresh
          VIRTUAL_ENV=/tmp/fresh uv pip install dist/*.whl "dspy==$LOCKED"
          /tmp/fresh/bin/python - <<'PY'
          import sys, rlm_harness
          assert "dspy" not in sys.modules, "import rlm_harness pulled in dspy"
          import dspy
          from rlm_harness import RLMConfig, RLMTask, configure
          from rlm_harness.testing import ScriptedInterpreter, scripted_lm, submit
          print("rlm-harness", rlm_harness.__version__, "on dspy", dspy.__version__)

          class T(RLMTask):
              signature = "q: str -> a: str"
              output_field = "a"

          configure(RLMConfig(main_model="d/m", sub_model="d/s"),
                    main_lm=scripted_lm([{"reasoning": "r", "code": "SUBMIT(a='ok')"}]))
          out = T(interpreter=ScriptedInterpreter([submit({"a": "ok"})])).run(q="hi")
          assert out == "ok", out
          print("fresh-install task run:", out)
          PY

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Lint
        # PINNED on purpose. `uvx ruff` resolves the latest release at run time, and ruff's DEFAULT
        # rule set is not a stable contract — 0.16 expanded it far past the pycodestyle/pyflakes
        # baseline and turned this job red overnight with no code change. Bump it deliberately, with
        # the resulting fixes in the same commit, rather than letting a release do it for you.
        run: uvx ruff@0.16.0 check .
