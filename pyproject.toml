[project]
name = "rlm-harness"
version = "1.23.0"
description = "A clean, reusable harness for building tasks on DSPy Recursive Language Models (RLMs)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boik Su" }]
keywords = [
    "dspy",
    "rlm",
    "recursive-language-models",
    "llm",
    "agent",
    "reinforcement-learning",
    "harness",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    # FLOOR 3.4.1 since rlm-harness 1.21.0 (3.4.0 since 1.14.0, 3.3.1 since 1.5.0, 3.3.0 since
    # 1.2.0). 3.4.1 rather than 3.4.0 because 3.4.0 registers its lazy-import proxy for openai in
    # `sys.modules`, and importing a submodule under it re-enters the proxy: with numpy installed,
    # `import dspy; import litellm` raised a circular ImportError, which `configure` swallowed,
    # silently skipping litellm's transport setting. 3.4.1 keeps its proxies out of `sys.modules`.
    # The kit already ran on 3.4.1 (supported since 1.16.0, below), so raising the floor retired a
    # workaround rather than adding one. The 3.4.0 floor itself was required, not
    # preferred: 3.4.0 DELETED the positional interpreter argument of `RLM.forward`/`aforward`, so
    # on it `interpreter_factory=` is the only way the kit can supply its own sandbox, and it
    # deleted `dspy.LMResponse` in favour of the differently-shaped `dspy.lm15.Response`. The kit
    # could have carried both, and it is one branch in one shim, but the tripwire that CAUGHT this
    # break (`test_the_interpreter_seam_still_exists_on_this_dspy`) can then no longer make a
    # single unconditional assertion, and trading the detector away to keep a dspy whose APIs are
    # gone is the wrong side of that bargain.
    #
    # AND AN UPPER BOUND, reversing the policy this comment used to state. "No cap, the
    # dspy-latest workflow is the defence instead" was tested twice and broke a consumer both
    # times: 3.3.0 renamed three things (CHANGELOG 1.0.1) and 3.4.0 removed the interpreter seam,
    # and in each case a fresh install of the CURRENT release silently resolved the breaking dspy.
    # The detector worked; it cannot protect an install that happens before anyone reads it.
    #
    # `<3.5.0` rather than `==3.4.0`: dspy has announced the next break AND its number, since
    # several 3.4.0 deprecations say "removal in 3.5", so the cap is upstream's own boundary
    # rather than a guess, and 3.4.x patches still reach consumers. An exact pin would also block
    # any consumer whose other dependencies resolve dspy differently.
    #
    # Measured, because the obvious objection is that a cap makes `dspy-latest.yml` decorative:
    # it does not. `uv run --with "dspy==<newer>"` OVERRIDES this bound, so that workflow still
    # installs and tests the newest dspy and still goes red the day 3.5.0 ships, which is exactly
    # when the next floor bump is due.
    #
    # 1.15.2 tightened this to `<3.4.1` and 1.16.0 lifts it back, having met the two conditions
    # that comment set. 3.4.1 is a patch release that changes what a run does: it installs a
    # sandbox "dspy facade" with an extra `execute` before the first turn, appends a sub-agent
    # paragraph to every RLM prompt, and charges sub-agent LM calls to `max_llm_calls`. Both
    # blockers are handled and pinned by tests that go red without the fix: the extra `execute`
    # no longer consumes a `ScriptedInterpreter` step, and a turn-timeout restart replays the
    # facade install (measured: `import dspy` in model code failed after a restart before this,
    # while the prompt still offered sub-agents). `RLMConfig.sandbox_sub_agents` turns the
    # capability off for a consumer who wants the sandbox boundary unchanged.
    "dspy>=3.4.1,<3.5.0",
    # 2.11 is dspy 3.4.1's own floor (and 3.4.0's). Declaring less would be a floor the kit cannot run on.
    "pydantic>=2.11.0",
]

[project.optional-dependencies]
# Observability is opt-in: the scaffold runs without it.
observe = [
    "langfuse>=4.6.1",
    "openinference-instrumentation-dspy>=0.1.36",
]
# MCP client (mcp_tools / McpCatalog). FLOOR 1.8.1 since rlm-harness 1.5.0: `>=1.0` was wrong
# from the start: `mcp.client.streamable_http` does not exist at 1.0.0, so the HTTP transport
# could not work at the declared floor. 1.8.1 rather than 1.8.0 because the floor is only
# meaningful if the suite PASSES on it, and it does not on 1.8.0: a refused connect takes ~16s
# there, against the <10s this kit asserts for fail-fast. Measured, not assumed. No upper bound, for the same reason dspy has none; the
# `mcp-latest` job in `.github/workflows/dspy-latest.yml` is the compensating control, and
# `ci.yml` additionally carries a PINNED 2.x leg so a major that is already out stays covered
# on every PR. Both majors are supported: see `rlm_harness/mcp.py`'s SDK VERSION TOLERANCE note.
mcp = [
    "mcp>=1.8.1",
]
# JSON-Schema validation (make_json_schema_validator): validate a parsed object against a
# vendored, version-pinned upstream JSON schema. Opt-in: the core scaffold runs without it.
# FLOOR 4.0.1 since rlm-harness 1.21.1, for the same reason as the subscription extra above and
# found by the same check: 4.0 is YANKED, its yank reason being "Improper python_requires
# declaration", and indeed it publishes an EMPTY `requires-python`. 4.0.1 declares `>=3.7` and is
# not yanked, and the four tests that exercise this extra pass on it.
jsonschema = [
    "jsonschema>=4.0.1",
]
# Claude Pro/Max SUBSCRIPTION LM (ClaudeAgentLM): run the planner and/or sub-LM on your own
# Claude login via the official Claude Agent SDK, injected through configure(main_lm=/sub_lm=).
# Opt-in: a plain API-key install never pulls the (heavy) SDK wheel.
#
# FLOOR 0.1.61 since rlm-harness 1.21.1, and the reason is the declared floor itself rather than
# anything the kit needs: 0.1.60 is YANKED on PyPI, and its yank reason says the file would be
# deleted on or after 2026-09-19 to free project storage. A floor nobody can cleanly resolve is
# not a floor, and a deleted one stops being installable at all. 0.1.59 and 0.1.60 are both
# yanked, so 0.1.61 is the nearest version that is not, and the kit's suite PASSES on it
# (142 tests across the three files that touch the SDK), which is the only thing that makes a
# floor mean anything. It also carries what the overage guard will need: `RateLimitEvent`,
# `RateLimitInfo`, `RateLimitStatus`, `RateLimitType` and `ClaudeAgentOptions.max_budget_usd` all
# exist there, so that work needs no further bump. Upper bound deliberately absent, the same
# posture as the other extras.
subscription = [
    "claude-agent-sdk>=0.1.61",
]
# Wall-clock-bounded regex matching (make_grep_files_tool): an LM-controlled pattern is bounded by
# a real timeout instead of a catastrophic-backtracking pattern hanging the host indefinitely:
# stdlib `re` has no way to bound this cost by any pure-Python mechanism. Opt-in: required
# outright by make_grep_files_tool (a friendly ImportError otherwise), no silent unsafe fallback,
# the same posture make_json_schema_validator already takes for its own `jsonschema` extra.
grep = [
    "regex>=2023.0.0",
]
# Correct, safe .gitignore-aware directory walking (list_candidate_paths): a hand-rolled
# .gitignore parser risks leaking files a consumer explicitly meant to exclude (.env, secrets) or
# wrongly excluding real source -- pathspec implements git's own gitwildmatch syntax correctly.
# Opt-in, and only actually imported when there's a real pattern to compile (a root/.gitignore
# present, or extra_ignore_patterns given) -- a friendly ImportError otherwise, no silent
# ignore-nothing fallback.
gitignore = [
    "pathspec>=0.12.0",
]
# Local similarity for a memory store (rlm_harness.memory_vectors): an embedding model run on the
# CPU through onnxruntime, its tokenizer, and numpy for the comparison. Floors lifted from the
# application this was taken from; no upper bound, the same posture as the other extras. The
# vectors are plain BLOBs in their own SQLite file, so no SQLite extension is needed, and a purge
# can erase them with the standard library alone. Opt-in: the model is ~135 MB and downloaded only
# when the host calls download_model.
memory-vectors = [
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "numpy>=2",
]

[project.urls]
Homepage = "https://github.com/qazbnm456/rlm-harness"
Repository = "https://github.com/qazbnm456/rlm-harness"
Changelog = "https://github.com/qazbnm456/rlm-harness/blob/main/CHANGELOG.md"
Issues = "https://github.com/qazbnm456/rlm-harness/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # The comparison half of the memory-vectors extra, so CI runs the real similarity code; the
    # model runtime (onnxruntime, tokenizers) is faked in the tests and never installed there.
    "numpy>=2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]  # >=1.27 for PEP 639 SPDX license expressions
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlm_harness"]

[tool.hatch.build.targets.sdist]
# hatchling's sdist default is every file git does not ignore, so anything lying in the working tree
# goes to PyPI. Three stray `tmp*/m.db` test stores reached a commit here that way, and a local
# build made while two review worktrees existed would have carried 268 files more. Naming the top
# level shuts that door: an untracked directory beside `docs/` or `tests/` is no longer a candidate.
# It is not a sandbox and does not pretend to be, because an untracked stray INSIDE a named
# directory still ships. What a list costs is the opposite failure, a path silently left OUT, which
# `tests/test_packaging.py` turns into a failing test rather than a thin sdist nobody notices.

include = [
    "/.githooks",
    "/.github",
    "/.gitignore",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/docs",
    "/examples",
    "/pyproject.toml",
    "/rlm_harness",
    "/tests",
    "/uv.lock",
]

[tool.ruff]
line-length = 110
target-version = "py311"

# Ruff's DEFAULT rule set is NOT a stable contract. 0.16 expanded it far past the pycodestyle/
# pyflakes baseline this project was written against, so `uvx ruff check .`: unpinned, in CI:
# went from green to 256 errors with nobody touching the code. The fix is in two halves: CI pins
# the ruff VERSION (so the rule set only moves when someone bumps it deliberately), and the
# handful of default rules that fight this project's design are ignored BY NAME below.
#
# Deliberately NOT adding a `select` list. Curating one is a real policy decision, and a first
# attempt at it immediately fired 107 PLC0415 "import not at top-level": against the ~107 LAZY
# imports that are load-bearing here (keeping modules dspy-free, deferring optional extras). A
# lint policy that argues with an invariant is worse than no policy.
[tool.ruff.lint]
ignore = [
    # This project's whole job is running model-authored code and DEGRADING rather than dying.
    # A blind `except Exception` around a sandbox boundary, a trace write, or a fetch is the
    # design, not an oversight: the caller must get a result object, never a propagated crash.
    "BLE001",
    # Same stance, one level down: a best-effort cleanup (killing a container, closing a trace)
    # must not raise out of a teardown path and mask the real error.
    "S110",
    # `__all__` here is grouped by comment-delimited SECTION (core / tools / rubric / serving /
    # MCP / subscription), which is more useful to a reader than alphabetical order.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# Delivered to a bare `python:*-slim` container as SOURCE TEXT (`python -u -c <this file>`) and
# constrained to the stdlib. `exec` is the product, the fd-capture temp file deliberately outlives
# a `with` block because fds 1/2 are dup2'd around it, and `%`-formatting keeps the file free of
# anything that could differ across the interpreter versions it may land on.
"rlm_harness/_sandbox_agent.py" = ["S102", "SIM115", "UP031"]
# Test idiom: `[x for x in xs if p(x)][0]` states "the one matching event" far more clearly than
# `next(iter(...))`, `pytest.raises(Exception)` is sometimes exactly the assertion, and a mutable
# class attribute on a throwaway fixture needs no `ClassVar` ceremony.
"tests/**" = ["RUF015", "B017", "RUF012", "S101"]
