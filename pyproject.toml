[project]
name = "rlm-harness"
version = "1.8.4"
description = "A clean, reusable harness for building tasks on DSPy Recursive Language Models (RLMs)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boik Su" }]
keywords = [
    "dspy",
    "rlm",
    "recursive-language-models",
    "llm",
    "agent",
    "reinforcement-learning",
    "harness",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    # FLOOR 3.3.1 since rlm-harness 1.5.0 (3.3.0 since 1.2.0). 3.2.x is strictly worse for
    # users — it accepts DUPLICATE tool names and silently keeps only one, does not reject a
    # keyword tool name at construction, and has no CodeExecutionError, so the kit's own
    # guarantees differed by whichever dspy a consumer happened to resolve.
    #
    # 3.3.1 is required, not merely preferred: `_dspy_compat.interpreter_instructions_kwargs`
    # needs `interpreter_factory.execution_instructions`, which 3.3.1 introduced — without it a
    # `container` run is told it cannot spawn subprocesses, which is the one thing that
    # interpreter exists to allow. 3.3.1 also re-parents `CodeInterpreterError` under
    # `DSPyError`, the hierarchy the cancel-is-never-recoverable invariant reads.
    #
    # No upper bound: a cap propagates through pinned consumers and blocks them from dspy
    # fixes; `.github/workflows/dspy-latest.yml` is the defence instead.
    "dspy>=3.3.1",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Observability is opt-in: the scaffold runs without it.
observe = [
    "langfuse>=4.6.1",
    "openinference-instrumentation-dspy>=0.1.36",
]
# MCP client (mcp_tools / McpCatalog). FLOOR 1.8.1 since rlm-harness 1.5.0: `>=1.0` was wrong
# from the start — `mcp.client.streamable_http` does not exist at 1.0.0, so the HTTP transport
# could not work at the declared floor. 1.8.1 rather than 1.8.0 because the floor is only
# meaningful if the suite PASSES on it, and it does not on 1.8.0: a refused connect takes ~16s
# there, against the <10s this kit asserts for fail-fast. Measured, not assumed. No upper bound, for the same reason dspy has none; the
# `mcp-latest` job in `.github/workflows/dspy-latest.yml` is the compensating control, and
# `ci.yml` additionally carries a PINNED 2.x leg so a major that is already out stays covered
# on every PR. Both majors are supported: see `rlm_harness/mcp.py`'s SDK VERSION TOLERANCE note.
mcp = [
    "mcp>=1.8.1",
]
# JSON-Schema validation (make_json_schema_validator): validate a parsed object against a
# vendored, version-pinned upstream JSON schema. Opt-in — the core scaffold runs without it.
jsonschema = [
    "jsonschema>=4.0",
]
# Claude Pro/Max SUBSCRIPTION LM (ClaudeAgentLM): run the planner and/or sub-LM on your own
# Claude login via the official Claude Agent SDK, injected through configure(main_lm=/sub_lm=).
# Opt-in — a plain API-key install never pulls the (heavy) SDK wheel.
subscription = [
    "claude-agent-sdk>=0.1.60",
]
# Wall-clock-bounded regex matching (make_grep_files_tool): an LM-controlled pattern is bounded by
# a real timeout instead of a catastrophic-backtracking pattern hanging the host indefinitely —
# stdlib `re` has no way to bound this cost by any pure-Python mechanism. Opt-in — required
# outright by make_grep_files_tool (a friendly ImportError otherwise), no silent unsafe fallback,
# the same posture make_json_schema_validator already takes for its own `jsonschema` extra.
grep = [
    "regex>=2023.0.0",
]
# Correct, safe .gitignore-aware directory walking (list_candidate_paths): a hand-rolled
# .gitignore parser risks leaking files a consumer explicitly meant to exclude (.env, secrets) or
# wrongly excluding real source -- pathspec implements git's own gitwildmatch syntax correctly.
# Opt-in, and only actually imported when there's a real pattern to compile (a root/.gitignore
# present, or extra_ignore_patterns given) -- a friendly ImportError otherwise, no silent
# ignore-nothing fallback.
gitignore = [
    "pathspec>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/qazbnm456/rlm-harness"
Repository = "https://github.com/qazbnm456/rlm-harness"
Changelog = "https://github.com/qazbnm456/rlm-harness/blob/main/CHANGELOG.md"
Issues = "https://github.com/qazbnm456/rlm-harness/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]  # >=1.27 for PEP 639 SPDX license expressions
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlm_harness"]

[tool.ruff]
line-length = 110
target-version = "py311"

# Ruff's DEFAULT rule set is NOT a stable contract. 0.16 expanded it far past the pycodestyle/
# pyflakes baseline this project was written against, so `uvx ruff check .` — unpinned, in CI —
# went from green to 256 errors with nobody touching the code. The fix is in two halves: CI pins
# the ruff VERSION (so the rule set only moves when someone bumps it deliberately), and the
# handful of default rules that fight this project's design are ignored BY NAME below.
#
# Deliberately NOT adding a `select` list. Curating one is a real policy decision, and a first
# attempt at it immediately fired 107 PLC0415 "import not at top-level" — against the ~107 LAZY
# imports that are load-bearing here (keeping modules dspy-free, deferring optional extras). A
# lint policy that argues with an invariant is worse than no policy.
[tool.ruff.lint]
ignore = [
    # This project's whole job is running model-authored code and DEGRADING rather than dying.
    # A blind `except Exception` around a sandbox boundary, a trace write, or a fetch is the
    # design, not an oversight: the caller must get a result object, never a propagated crash.
    "BLE001",
    # Same stance, one level down — a best-effort cleanup (killing a container, closing a trace)
    # must not raise out of a teardown path and mask the real error.
    "S110",
    # `__all__` here is grouped by comment-delimited SECTION (core / tools / rubric / serving /
    # MCP / subscription), which is more useful to a reader than alphabetical order.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# Delivered to a bare `python:*-slim` container as SOURCE TEXT (`python -u -c <this file>`) and
# constrained to the stdlib. `exec` is the product, the fd-capture temp file deliberately outlives
# a `with` block because fds 1/2 are dup2'd around it, and `%`-formatting keeps the file free of
# anything that could differ across the interpreter versions it may land on.
"rlm_harness/_sandbox_agent.py" = ["S102", "SIM115", "UP031"]
# Test idiom: `[x for x in xs if p(x)][0]` states "the one matching event" far more clearly than
# `next(iter(...))`, `pytest.raises(Exception)` is sometimes exactly the assertion, and a mutable
# class attribute on a throwaway fixture needs no `ClassVar` ceremony.
"tests/**" = ["RUF015", "B017", "RUF012", "S101"]
